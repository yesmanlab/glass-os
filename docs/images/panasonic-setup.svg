<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8e8e93"/></marker></defs>
  <rect width="1200" height="420" rx="24" fill="#0f1115"/>
  <text x="40" y="54" fill="#fff" font-size="26" font-weight="700">Panasonic My Home Screen 3.0: Glass OS through a streaming stick</text>
  <text x="40" y="84" fill="#8e8e93" font-size="16">My Home Screen runs Firefox OS, not Android, so Glass OS can't be installed on the TV itself. A stick on HDMI runs it instead.</text>

  <rect x="40" y="120" width="330" height="250" rx="18" fill="#1c1f26" stroke="#2c313b"/>
  <text x="64" y="156" fill="#fff" font-size="20" font-weight="700">Fire TV or Google TV stick</text>
  <rect x="64" y="176" width="282" height="76" rx="14" fill="#0a84ff"/>
  <text x="84" y="208" fill="#fff" font-size="18" font-weight="700">Glass OS</text><text x="84" y="234" fill="#e5f0ff" font-size="15">installed with the Fire TV guide</text>
  <text x="64" y="290" fill="#d1d1d6" font-size="15">Its remote works the TV over HDMI-CEC:</text><text x="64" y="312" fill="#d1d1d6" font-size="15">power and volume.</text>
  <text x="64" y="346" fill="#8e8e93" font-size="14">Any Fire TV stick or Google TV device.</text>

  <line x1="370" y1="245" x2="470" y2="245" stroke="#8e8e93" stroke-width="3" marker-end="url(#a)"/>
  <text x="384" y="230" fill="#8e8e93" font-size="15">HDMI 1–3</text><text x="384" y="270" fill="#8e8e93" font-size="15">(CEC on)</text>

  <rect x="472" y="120" width="688" height="250" rx="18" fill="#1c1f26" stroke="#2c313b"/>
  <text x="496" y="156" fill="#fff" font-size="20" font-weight="700">Panasonic TC-49FX700C · My Home Screen 3.0</text>
  <g font-size="15" fill="#d1d1d6">
    <rect x="496" y="176" width="200" height="170" rx="14" fill="#262a33"/>
    <circle cx="524" cy="204" r="16" fill="#0a84ff"/><text x="524" y="209" fill="#fff" font-weight="700" text-anchor="middle">1</text>
    <text x="548" y="209" fill="#fff" font-weight="700">VIERA Link</text><text x="512" y="244">Menu → Setup →</text><text x="512" y="266">VIERA Link Settings</text><text x="512" y="288">→ VIERA Link: On</text><text x="512" y="318">Power on Link: On</text>

    <rect x="708" y="176" width="210" height="170" rx="14" fill="#262a33"/>
    <circle cx="736" cy="204" r="16" fill="#0a84ff"/><text x="736" y="209" fill="#fff" font-weight="700" text-anchor="middle">2</text>
    <text x="760" y="209" fill="#fff" font-weight="700">Pin the input</text><text x="724" y="244">On My Home Screen,</text><text x="724" y="266">pin the stick's HDMI</text><text x="724" y="288">input first.</text><text x="724" y="318">Start-up screen: that</text><text x="724" y="338">input (if offered).</text>

    <rect x="930" y="176" width="206" height="170" rx="14" fill="#262a33"/>
    <circle cx="958" cy="204" r="16" fill="#0a84ff"/><text x="958" y="209" fill="#fff" font-weight="700" text-anchor="middle">3</text>
    <text x="982" y="209" fill="#fff" font-weight="700">Tidy up</text><text x="946" y="244">Remove pinned apps</text><text x="946" y="266">you don't use.</text><text x="946" y="296">Turn off data and</text><text x="946" y="318">ad-tracking options.</text>
  </g>
  <text x="40" y="400" fill="#8e8e93" font-size="14">Menu names vary by firmware; check the TV's built-in eHELP for the exact wording.</text>
</svg>
